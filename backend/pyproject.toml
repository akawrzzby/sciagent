[project]
name = "sciagent-backend"
version = "0.1.0"
description = "SciAgent - AI research assistant agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "numpy>=1.26.0",
    "networkx>=3.3",
    "scikit-learn>=1.5.0",
    "pillow>=10.3.0",
    "matplotlib>=3.8.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
# Dense retrieval / reranking. Installed separately because the wheel is large.
embeddings = [
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
