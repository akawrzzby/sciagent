# ---------------------------------------------------------------------------
# SciAgent 前端 Nginx 配置
#
# 设计前提：前端所有请求都走同源 /api 前缀
#   (frontend/src/lib/api.ts: BASE = import.meta.env.VITE_API_BASE ?? '/api')
# 因此本文件同时承担两个职责：托管 Vite 构建产物 + 把 /api 反代到后端容器。
# 前端与后端必须同源，不能拆成两个独立域名。
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传论文 PDF：赛题含 541 页大文件，默认 1m 会直接 413
    client_max_body_size 200M;
    # 大文件上传耗时可能较长，默认 60s 太短
    client_body_timeout 300s;
    send_timeout 3600s;

    # ---- gzip -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # 注意：一旦显式声明 gzip_types，就会覆盖 Nginx 内置的 "text/html"，
    # 所以必须把 text/html 一起写进来，否则首页 HTML 反而不再压缩。
    gzip_types text/html text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ---- 静态资源 -------------------------------------------------------
    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- SPA history 路由 ----------------------------------------------
    # React Router 的深链接（如 /papers/xxx、/graph）刷新时必须回退到
    # index.html，否则 Nginx 会返回 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端根信息（GET /api）-----------------------------------------
    # 单独匹配精确路径 /api（不带斜杠），它不属于下面的 /api/ 前缀块
    location = /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- API 反向代理（含 SSE 流式输出）--------------------------------
    location /api/ {
        # 不带结尾斜杠 => 原样透传 /api/xxx 路径，后端路由本身就是 /api/xxx
        proxy_pass http://backend:8000;

        # ===== SSE 关键配置 =====
        # 后端的 /api/rag/ask 与 /api/rag/sessions/{id}/events 返回
        # text/event-stream 长连接。Nginx 默认会对上游响应做缓冲，
        # 一旦缓冲，前端 EventSource / fetch 流式读取拿到的就是"攒完一次性吐"，
        # 流式输出（逐字生成）会完全失效。所以必须：
        #   proxy_buffering off  关闭上游响应缓冲，收到一段就转发一段
        #   proxy_cache off      禁止缓存层介入流式响应
        #   Connection ''        清空 Connection 头，保持与上游的长连接
        #   HTTP/1.1             1.0 不支持 chunked 流式传输
        #   超时放大到 3600s     长推理可能几分钟无数据，60s 默认值会断流
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE 文本再压缩会引入额外缓冲，这里关掉
        gzip off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 大 PDF 上传：直接流式转发给后端，不先落盘到 Nginx
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        # 后端异常时不要把 5xx 页面替换成 Nginx 默认错误页
        proxy_intercept_errors off;
    }
}
